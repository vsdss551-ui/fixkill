name: build
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ultimatepvp_etap2.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - run: gradle build --console=plain
        working-directory: ultimatepvp
      - uses: actions/upload-artifact@v4
        with:
          name: ultimatepvp-jar
          path: |
            ultimatepvp/build/libs/ultimatepvp-*.jar
            !ultimatepvp/build/libs/*-sources.jar
