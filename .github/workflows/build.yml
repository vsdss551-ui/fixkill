name: Build KillEffect

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ustaw Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Zbuduj moda
        run: gradle --no-daemon clean build

      - name: Udostępnij plik JAR
        uses: actions/upload-artifact@v4
        with:
          name: KillEffect-Fabric-1.21.4
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
